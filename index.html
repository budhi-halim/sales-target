<!doctype html>
<html lang="en" class="isi-theme" data-theme="system">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sales Target · Islandsun</title>
  <link rel="icon" href="assets/family/assets/icons/favicon.ico">
  <link rel="stylesheet" href="assets/family/css/tokens.css">
  <link rel="stylesheet" href="assets/family/css/components.css">
  <link rel="stylesheet" href="assets/family/css/interaction.css">
  <link rel="stylesheet" href="assets/family/css/workspace.css">
  <link rel="stylesheet" href="assets/family/css/workbook.css">
  <script type="module" src="assets/family/js/navigation.js"></script>
  <script type="module" src="js/ui.js"></script>
  <script type="module" src="https://pyscript.net/releases/2025.8.1/core.js"></script>
  <script type="py" src="py/main.py" config="config.json"></script>
</head>
<body class="isi-ui isi-workspace workbook-app" data-family-app>
  <header class="isi-header">
    <div class="isi-brand"><img src="assets/family/assets/icons/family.svg" alt=""><span>Sales Target<small>ISLANDSUN INDONESIA</small></span></div>
    <div class="isi-header-actions">
      <a class="isi-button isi-button--quiet" data-family-home href="../isi-share/">All apps</a>
      <button type="button" id="theme-toggle" class="isi-button isi-button--icon isi-theme-toggle" aria-label="Switch color scheme"></button>
    </div>
  </header>
  <main class="workspace-main">
    <div id="loading-host"></div>
    <div id="workspace-content" class="workspace-stack" hidden>
      <h1>Sales Target</h1>
      <section class="isi-card workspace-stack" aria-label="Workbook files">
        <form id="extractForm" class="workbook-form"><label for="files">XLS / XLSX files</label><input type="file" id="files" multiple accept=".xls,.xlsx" aria-describedby="file-count"><p id="file-count" class="isi-muted" role="status">No files selected</p><div class="workspace-actions"><button type="submit" id="processButton" class="isi-button isi-button--primary" disabled>Process and Download</button><button type="button" id="reset-files" class="isi-button">Reset</button></div></form>
        <template id="message"></template>
        <div id="workbook-message" role="status" hidden></div>
      </section>
      <details class="isi-card workbook-instructions" open><summary>Input format</summary><div><p>Use row 3 for headers and row 4 onward for data.</p><div class="isi-table-region" tabindex="0" aria-label="Input columns"><table class="isi-table"><thead><tr><th scope="col">B</th><th scope="col">C</th><th scope="col">D</th><th scope="col">E</th><th scope="col">F</th><th scope="col">G</th><th scope="col">H</th><th scope="col">I</th></tr></thead><tbody><tr><td>Area</td><td>Date</td><td>Invoice No</td><td>Customer Name</td><td>Product Type</td><td>Product Name</td><td>Quantity</td><td>Unit Price</td></tr></tbody></table></div></div></details>
    </div>
    <dialog id="processing-dialog" class="workspace-dialog processing-dialog" aria-label="Processing files"><div><span class="isi-spinner" aria-hidden="true"></span><span class="processing-complete" aria-hidden="true" hidden>✓</span><p id="processing-text" role="status">Processing your files…</p></div></dialog></main>
</body>
</html>
